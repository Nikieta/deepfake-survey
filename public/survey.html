<!DOCTYPE html>
<html>
<head>
<title>Artifact Identification</title>

<style>
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:#f6f7fb;
  margin:0;
  padding:24px;
  color:#111827;
}
.container{max-width:1000px;margin:auto;}
.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:20px 26px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}
.progress-container{width:100%;background:#e5e7eb;border-radius:8px;height:10px;margin-bottom:8px;}
.progress-bar{height:10px;width:0;background:#4f46e5;border-radius:8px;}
.progress-text{text-align:center;margin-bottom:10px;font-weight:600;}
audio{width:100%;margin:6px 0 12px 0;}
textarea{
  width:100%;
  min-height:55px;
  padding:8px;
  border-radius:8px;
  border:1px solid #d1d5db;
  margin-top:4px;
}
button{
  background:#4f46e5;
  color:white;
  border:none;
  padding:10px 18px;
  border-radius:8px;
  font-size:14px;
  cursor:pointer;
}
.option{margin-bottom:6px;color:#374151;}
.option small{display:block;color:#6b7280;font-weight:400;}
.split{display:flex;gap:80px;align-items:flex-start;}
.leftPanel{flex:1.1}
.rightPanel{flex:1;padding-left:24px;border-left:1px solid #e5e7eb;}
#accuracyBox{display:none;margin-top:10px;}
</style>
</head>

<body>
<div class="container">
<h1>Artifact Identification</h1>

<div class="card">

<div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
<div class="progress-text" id="progressText"></div>

<audio controls id="audioPlayer"></audio>

<p><b>Q1. Which artifact category best describes the issue?</b></p>

<div class="split">

<div class="leftPanel">
<label class="option"><input type="radio" name="artifactCategory" value="Articulation" onchange="showSubOptions()"> <b>Articulation Related</b><small>Speech sounds unclear</small></label>
<label class="option"><input type="radio" name="artifactCategory" value="Linguistic" onchange="showSubOptions()"> <b>Linguistic / Paralinguistic</b><small>Word or pronunciation issues</small></label>
<label class="option"><input type="radio" name="artifactCategory" value="Temporal" onchange="showSubOptions()"> <b>Temporal / Prosodic</b><small>Timing or emotion unnatural</small></label>
<label class="option"><input type="radio" name="artifactCategory" value="Signal" onchange="showSubOptions()"> <b>Signal-Level</b><small>Noise or distortion present</small></label>
<label class="option"><input type="radio" name="artifactCategory" value="Voice" onchange="showSubOptions()"> <b>Voice Quality</b><small>Tone sounds artificial</small></label>
<label class="option"><input type="radio" name="artifactCategory" value="None" onchange="showSubOptions()"> <b>No obvious artifact</b></label>
</div>

<div id="subOptions" class="rightPanel"></div>

</div>

<p><b>Q2. How difficult is the artifact to spot?</b></p>
<label class="option"><input type="radio" name="difficulty" value="1"> 1</label>
<label class="option"><input type="radio" name="difficulty" value="2"> 2</label>
<label class="option"><input type="radio" name="difficulty" value="3"> 3</label>
<label class="option"><input type="radio" name="difficulty" value="4"> 4</label>
<label class="option"><input type="radio" name="difficulty" value="5"> 5</label>

<p><b>Q3. Describe the artifact in your own language.</b></p>
<textarea id="comments" placeholder="The audio sounds to be synthetic (You may use the labels above)."></textarea>

<div id="accuracyBox">
<p><b>Q4. Do you find the description accurate for the artifacts?</b></p>
<label class="option"><input type="radio" name="accuracy" value="Highly accurate"> Highly accurate</label>
<label class="option"><input type="radio" name="accuracy" value="Moderately accurate"> Moderately accurate</label>
<label class="option"><input type="radio" name="accuracy" value="Slightly accurate"> Slightly accurate</label>
<label class="option"><input type="radio" name="accuracy" value="Not accurate"> Not accurate</label>
</div>

<p><b>Q5. Describe any other artifact not highlighted above.</b></p>
<textarea id="extraComments" placeholder="Additional Description (Optional)"></textarea>

<div style="margin-top:14px;display:flex;justify-content:space-between;">
<button onclick="goBack()">Back</button>
<button id="nextBtn" onclick="submitAndNext()">Next Audio</button>
</div>

</div>
</div>

<script>

const sessionData = JSON.parse(sessionStorage.getItem("participantData"));
if(!sessionData) window.location.href="index.html";

const APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwgJ6DNVvq6_OzoaRkrI7m9PXI51nnp0S3HIPqkOF1kAVJpzCXJt8y2bVszt_4dGj0G/exec";

const audioPool=[
"DF_E_2000013.flac","DF_E_2000024.flac","DF_E_2000026.flac","DF_E_2000042.flac",
"DF_E_2000048.flac","DF_E_2000053.flac","DF_E_2000055.flac","DF_E_2000075.flac",
"DF_E_2000079.flac","DF_E_2000091.flac","DF_E_2000100.flac","DF_E_2000102.flac",
"DF_E_2000508.flac","DF_E_2000524.flac","DF_E_2749699.flac","DF_E_2749700.flac",
"DF_E_2749711.flac","DF_E_2749732.flac","DF_E_2749783.flac","DF_E_2749817.flac"
];

function shuffle(a){return a.sort(()=>Math.random()-0.5);}
let selectedSamples=shuffle([...audioPool]).slice(0,15).map((f,i)=>({file:"audio/"+f,id:f}));

let currentIndex=0;
let audioPlayed=false;
const audioPlayer=document.getElementById("audioPlayer");
audioPlayer.addEventListener("play",()=>audioPlayed=true);

function loadSample(){
const s=selectedSamples[currentIndex];
audioPlayer.src=s.file;
audioPlayer.load();
audioPlayed=false;

document.getElementById("progressBar").style.width=((currentIndex+1)/selectedSamples.length*100)+"%";
document.getElementById("progressText").innerText=`Sample ${currentIndex+1} of ${selectedSamples.length}`;
document.getElementById("accuracyBox").style.display=currentIndex<12?"block":"none";
document.getElementById("nextBtn").innerText=currentIndex===selectedSamples.length-1?"Finish":"Next Audio";
}

function showSubOptions(){
const defs={
Temporal:[["Awkward Pauses","Pauses misplaced"],["Missing Pauses","Speech continuous"],["Flat Intonation","Monotone"]],
Signal:[["Background Noise","Hiss/static"],["Impulsive Noise","Clicks/pops"]],
Articulation:[["Poor Word Articulation","Words unclear"],["Slurred Speech","Words merged"]],
Linguistic:[["Word Repetition","Words repeat"],["Mispronounced Words","Wrong pronunciation"],["Unnatural Paralinguistics","Odd fillers"]],
Voice:[["Unnatural Timbre","Metallic tone"],["Muffled Voice","Distant"],["Distorted Voice","Wobbly"]]
};
const cat=document.querySelector('input[name="artifactCategory"]:checked')?.value;
const c=document.getElementById("subOptions");
c.innerHTML="";
if(!cat||cat==="None")return;
defs[cat].forEach(d=>{
c.innerHTML+=`<label class="option"><input type="radio" name="subArtifact" value="${d[0]}"><b>${d[0]}</b><small>${d[1]}</small></label>`;
});
}

async function submitAndNext(){
const s=selectedSamples[currentIndex];
const cat=document.querySelector('input[name="artifactCategory"]:checked')?.value;
const sub=document.querySelector('input[name="subArtifact"]:checked');
const diff=document.querySelector('input[name="difficulty"]:checked');
const accuracy=document.querySelector('input[name="accuracy"]:checked');

if(!audioPlayed)return alert("Please play audio.");
if(!cat||(cat!=="None"&&!sub))return alert("Select artifact.");
if(!diff)return alert("Select difficulty.");
if(currentIndex<12 && !accuracy)return alert("Select accuracy.");

const payload={
...sessionData,
audio_id:s.id,
sample:currentIndex+1,
category:cat,
artifact:cat==="None"?"None":sub.value,
difficulty:diff.value,
comments:document.getElementById("comments").value,
accuracy:accuracy?accuracy.value:"",
extra:document.getElementById("extraComments").value
};

await fetch(APPS_SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(payload)});

currentIndex++;
if(currentIndex>=selectedSamples.length){window.location.href="thankyou.html";return;}
loadSample();
}

function goBack(){if(currentIndex>0){currentIndex--;loadSample();}}
loadSample();

</script>

</body>
</html>
