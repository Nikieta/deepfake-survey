<!DOCTYPE html>
<html>
<head>
<title>Audio Listening Task</title>

<style>
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:#f6f7fb;
  margin:0;
  padding:40px;
  color:#111827;
}
.container{max-width:900px;margin:auto;}
.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:28px 32px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}
.progress-container{width:100%;background:#e5e7eb;border-radius:8px;height:10px;margin-bottom:12px;}
.progress-bar{height:10px;width:0;background:#4f46e5;border-radius:8px;}
.progress-text{text-align:center;margin-bottom:20px;font-weight:600;}
audio{width:100%;margin:10px 0;}
textarea{width:100%;min-height:90px;padding:8px;border-radius:8px;border:1px solid #d1d5db;}
button{background:#4f46e5;color:white;border:none;padding:10px 18px;border-radius:8px;font-size:14px;cursor:pointer;}
button:disabled{background:#9ca3af;}
.error{color:#dc2626;font-size:13px;margin-top:6px;display:none;}
select{padding:6px;border-radius:6px;border:1px solid #d1d5db;}
#validationBox{display:none;margin-top:18px;padding:14px;border-radius:10px;background:#f3f4f6;}
</style>
</head>

<body>
<div class="container">
<h1>Audio Deepfake Sample</h1>

<div class="card">

<div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
<div class="progress-text" id="progressText"></div>

<audio controls id="audioPlayer">
<source id="audioSource" src="" type="audio/flac">
</audio>

<div id="audioError" class="error">Please play the audio at least once.</div>

<p><b>Q1. Which artifact category best describes the issue?</b></p>

<div style="display:flex;gap:40px;align-items:flex-start;">
<div style="min-width:260px;">
<select id="artifactCategory" onchange="showSubOptions()" style="width:100%;">
<option value="">-- Select category --</option>
<option value="Articulation">Articulation Related</option>
<option value="Linguistic">Linguistic / Paralinguistic</option>
<option value="Temporal">Temporal / Prosodic</option>
<option value="Signal">Signal-Level</option>
<option value="Voice">Voice-Quality Related</option>
<option value="None">No obvious artifact</option>
</select>
</div>

<div id="subOptions" style="flex:1;"></div>
</div>

<p><b>Q2. How easy or difficult was it to identify?</b></p>
<label><input type="radio" name="difficulty" value="Easy"> Easy</label>
<label><input type="radio" name="difficulty" value="Neutral"> Neutral</label>
<label><input type="radio" name="difficulty" value="Difficult"> Difficult</label>

<p><b>Q3. Describe the artifact in your own language.</b></p>
<textarea id="comments"></textarea>

<div id="validationBox">
<div style="font-weight:600;margin-bottom:6px;">Provided description for this audio</div>
<div id="groundTruthText" style="margin-bottom:12px;"></div>

<b>Q4. How good is this description for the audio?</b><br>
<label><input type="radio" name="rating" value="1"> 1 (Very Poor)</label><br>
<label><input type="radio" name="rating" value="2"> 2</label><br>
<label><input type="radio" name="rating" value="3"> 3 (Neutral)</label><br>
<label><input type="radio" name="rating" value="4"> 4</label><br>
<label><input type="radio" name="rating" value="5"> 5 (Excellent)</label>
</div>

<div style="margin-top:20px;display:flex;justify-content:space-between;">
<button onclick="goBack()">Back</button>
<button id="nextBtn" onclick="submitAndNext()">Next Audio</button>
</div>

</div>
</div>

<script>

const sessionData = JSON.parse(sessionStorage.getItem("participantData"));
if(!sessionData) window.location.href="index.html";

const APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwgJ6DNVvq6_OzoaRkrI7m9PXI51nnp0S3HIPqkOF1kAVJpzCXJt8y2bVszt_4dGj0G/exec";

const audioPlayer=document.getElementById("audioPlayer");
const audioSource=document.getElementById("audioSource");

let audioPlayed=false;
audioPlayer.addEventListener("play",()=>audioPlayed=true);

const audioPool=[ /* your list unchanged */ ];
const groundTruthMap={ /* your map unchanged */ };

function shuffle(arr){return arr.sort(()=>Math.random()-0.5);}

let selectedSamples=shuffle([...audioPool]).slice(0,15).map((f,i)=>({
file:"audio/"+f,
id:f,
isValidation:i>=12,
groundTruth:groundTruthMap[f]
}));

let responses=new Array(selectedSamples.length).fill(null);
let currentIndex=0;

function showSubOptions(){
const map={
Articulation:["Poor Word Articulation","Slurred Speech"],
Linguistic:["Word Repetition","Mispronounced Words","Odd filler sounds"],
Temporal:["Awkward pauses","Missing pauses","Flat voice"],
Signal:["Background noise","Clicks/pops"],
Voice:["Metallic voice","Muffled voice","Wobbly voice"]
};
const cat=document.getElementById("artifactCategory").value;
const c=document.getElementById("subOptions");
c.innerHTML="";
if(!cat||cat==="None")return;
map[cat].forEach(o=>{
c.innerHTML+=`<label style="display:block;margin-bottom:6px;">
<input type="radio" name="subArtifact" value="${o}"> ${o}
</label>`;
});
}

function loadSample(){
const s=selectedSamples[currentIndex];
audioSource.src=s.file;
audioPlayer.load();

const saved=responses[currentIndex];
audioPlayed=!!saved;

document.getElementById("artifactCategory").value=saved?.category||"";
document.getElementById("comments").value=saved?.comments||"";
document.querySelectorAll("input[type=radio]").forEach(r=>r.checked=false);
showSubOptions();

setTimeout(()=>{
if(saved?.artifact){
const el=document.querySelector(`input[name="subArtifact"][value="${saved.artifact}"]`);
if(el) el.checked=true;
}
if(saved?.difficulty){
const d=document.querySelector(`input[name="difficulty"][value="${saved.difficulty}"]`);
if(d) d.checked=true;
}
if(saved?.rating){
const r=document.querySelector(`input[name="rating"][value="${saved.rating}"]`);
if(r) r.checked=true;
}
},40);

document.getElementById("progressBar").style.width=((currentIndex+1)/selectedSamples.length*100)+"%";
document.getElementById("progressText").innerText=`Sample ${currentIndex+1} of ${selectedSamples.length}`;

const v=document.getElementById("validationBox");
if(s.isValidation){
v.style.display="block";
document.getElementById("groundTruthText").innerText=s.groundTruth;
}else v.style.display="none";

document.getElementById("nextBtn").innerText=currentIndex===selectedSamples.length-1?"Finish":"Next Audio";
}

async function submitAndNext(){
const s=selectedSamples[currentIndex];
const cat=document.getElementById("artifactCategory").value;
const sub=document.querySelector('input[name="subArtifact"]:checked');
const diff=document.querySelector('input[name="difficulty"]:checked');
const rating=document.querySelector('input[name="rating"]:checked');

if(!audioPlayed)return alert("Please play audio.");
if(!cat||(cat!=="None"&&!sub))return alert("Select artifact.");
if(!diff)return alert("Select difficulty.");
if(s.isValidation&&!rating)return alert("Rate description.");

const payload={
...sessionData,
audio_id:s.id,
sample:currentIndex+1,
category:cat,
artifact:cat==="None"?"None":sub.value,
difficulty:diff.value,
comments:document.getElementById("comments").value,
rating:s.isValidation?rating.value:""
};

responses[currentIndex]=payload;

await fetch(APPS_SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(payload)});

currentIndex++;
if(currentIndex>=selectedSamples.length){
window.location.href="thankyou.html";
return;
}
loadSample();
}

function goBack(){
if(currentIndex===0)return;
currentIndex--;
loadSample();
}

loadSample();

</script>
</body>
</html>
